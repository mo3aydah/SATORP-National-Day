<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="preload" href="assets/fonts/Satorp-Medium.otf" as="font" type="font/otf" crossorigin="anonymous">

    <title>بطاقة تهنئة اليوم الوطني</title>
</head>
<body data-card-image="assets/images/National-Day-ARA.jpg" data-download-name="national-day-greeting.png">
    <div class="container mt-3">
        <div class="row">
            <div class="imageCover text-center">
                <canvas id="myCanvas" width="1080" height="1080"></canvas>
            </div>
        </div>
        <div class="form-group">
            <div class="row mt-1 g-3 justify-content-center">
                <div class="col-auto">
                    <input type="text" class="form-control" name="name" id="name" placeholder="أكتب اسمك هنا" dir="rtl" />
                </div>
            </div>
            <div class="row justify-content-center mt-3 pb-3">
                <div class="col-auto">
                    <button type="button" id="downloadCard" class="btn btn-light">حمل البطاقة</button>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-auto">
                    <a href="en.html" class="lang-switch">English</a>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center mt-5 py-3">
        <p class="mb-0">Powered by
            <a href="https://www.6degrees.com" target="_blank" rel="noopener" class="text-decoration-none fw-bold">
                6 Degrees
            </a>
        </p>
    </footer>

    <script src="assets/js/card.js"></script>
</body>
</html>
