<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
    <link rel="stylesheet" href="assets/css/style.css" />

    <meta name="description" content="Create a special Saudi National Day greeting card and share it with your loved ones." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SATORP National Day Greeting Card" />
    <meta property="og:description" content="Create a special Saudi National Day greeting card and share it with your loved ones." />
    <meta property="og:image" content="https://mo3aydah.github.io/SATORP-National-Day/assets/images/National-Day-1.jpg" />
    <meta property="og:url" content="https://mo3aydah.github.io/SATORP-National-Day/" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>National Day Greeting | بطاقة تهنئة اليوم الوطني</title>
</head>
<body class="page-lang-select">
    <div class="lang-select-bg">
        <div class="lang-select-bg-mirror" id="langSelectBgMirror" aria-hidden="true"></div>
    </div>
    <div class="container page-lang-select-inner">
        <section class="lang-select-content" aria-label="Language selection">
            <h1 class="lang-select-title">
                <span class="lang-select-title-ar lang-ar" dir="rtl">تهنئة اليوم الوطني لمن يعز عليك</span>
                <span class="lang-select-title-en lang-en">A National Day Greeting for Someone Special</span>
            </h1>
            <p class="lang-select-desc lang-select-desc-ar lang-ar" dir="rtl">أنشئ بطاقة تهنئة باليوم الوطني مميزة وشاركها مع من تحب</p>
            <p class="lang-select-desc lang-en">Create a special National Day greeting card and share it with your loved ones</p>
            <div class="card-deck" id="cardDeck" role="listbox" aria-label="Choose card design">
                <div class="card-deck-item selected" data-card="1" role="option" aria-selected="true" tabindex="0">
                    <img src="assets/images/National-Day-1.jpg?v=3" alt="National Day card design 1" />
                </div>
                <div class="card-deck-item" data-card="2" role="option" aria-selected="false" tabindex="0">
                    <img src="assets/images/National-Day-2.jpg?v=3" alt="National Day card design 2" />
                </div>
                <div class="card-deck-item" data-card="3" role="option" aria-selected="false" tabindex="0">
                    <img src="assets/images/National-Day-3.jpg?v=2" alt="National Day card design 3" />
                </div>
            </div>
            <div class="deck-dots" id="deckDots" aria-label="Card designs">
                <button type="button" aria-label="Design 1"></button>
                <button type="button" aria-label="Design 2"></button>
                <button type="button" aria-label="Design 3"></button>
            </div>
            <p class="deck-hint deck-hint-bilingual">
                <span class="lang-ar" dir="rtl">اسحب واختر</span>
                <span class="deck-hint-sep" aria-hidden="true"> · </span>
                <span class="lang-en">Swipe and choose</span>
            </p>
            <div class="lang-select-buttons">
                <a href="ar.html" id="langAr" class="btn lang-btn-primary" dir="rtl" aria-label="العربية">العربية</a>
                <a href="en.html" id="langEn" class="btn lang-btn-primary" aria-label="English">English</a>
            </div>
        </section>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/deck-select.js"></script>
    <footer class="text-center mt-5 py-2 fixed-bottom footer-lang-page">
        <p class="mb-0">Powered by
            <a href="https://6degrees.com.sa/en" target="_blank" rel="noopener" class="footer-link footer-logo-link">
                <img src="assets/images/6degrees-logo.png" alt="6 Degrees" class="footer-logo" />
            </a>
        </p>
    </footer>
</body>
</html>
